<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Films</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>

<body>

<div class="container">

    <h2>Add Film</h2>
    <hr/>
    <form th:action="@{/saveFilm}"
          enctype="multipart/form-data"
          method="POST">
        <input type="text"
               th:value="${film?.getName() != null? film?.getName():''}"
               name="name" placeholder="Enter name" class="form-control col-4 mb-4"/>

        <input type="text"
               th:value="${film?.getCategory() != null? film?.getCategory():''}"
               name="category" placeholder="Enter category" class="form-control col-4 mb-4"/>

        <input type="text"
               th:value="${film?.getLength() != null? film?.getLength():''}"
               name="length" placeholder="Enter length" class="form-control col-4 mb-4"/>

        <!---<input type="text" name="pubDate}" placeholder="Enter pubDate" class="form-control col-4 mb-4"/>-->

        <!--        <input type="date" name="pubDate"-->
        <!--               th:value="${film?.getName() || ''}"-->
        <!--               placeholder="Enter pubDate" class="form-control col-4 mb-4"-->
        <!--               minlength="2" maxlength="20"/>-->
        <input type="text"
               th:value="${film?.getPubDate() != null? film?.getPubDate():''}"
               name="pubDate" placeholder="Enter pub date" class="form-control col-4 mb-4"/>
        <input type="text"
               th:value="${film?.getDirector() != null? film?.getDirector():''}"
               name="director" placeholder="Enter director" class="form-control col-4 mb-4"/>

        <input type="text"
               th:value="${film?.getScriptAuthor()  != null? film?.getScriptAuthor():''}"

               name="scriptAuthor" placeholder="Enter script author"
               class="form-control col-4 mb-4"/>

        <input type="text"
               th:value="${film?.getCast() != null? film?.getCast():''}"
               name="cast" placeholder="Enter cast" class="form-control col-4 mb-4"/>

        <input type="file" class="form-control"
               th:value="${base64Image  != null? base64Image:''}"
               placeholder="Picture"
               name="picture"/>

        <button class="btn btn-primary" type="submit">Save</button>
        <input type="hidden" class="hide" name="id"
               th:value="${film?.getId() != null? film?.getId():''}"/>
    </form>
    <hr/>
    <a th:href="@{/list}">Back to list</a>


</div>
</body>
</html>
