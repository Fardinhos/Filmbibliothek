<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>List Users</title>
    <link rel="stylesheet"
          type="text/css"
          href="https://cdn.datatables.net/v/bs4/dt-1.11.5/datatables.min.css"/>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
    <!--CSS found here https://codepen.io/hesguru/pen/BaybqXv for 5 stars -->
    <link rel="stylesheet" th:href="@{/maincss.css}"/>
</head>

<body>


<div class="container">
    <div style="display: flex;flex-direction: row;justify-content: space-around">
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="Logout"/>
        </form>

        <form th:action="@{/}" method="get">
            <input type="submit" value="Back"/>
        </form>
    </div>
    <hr/>
    <div class="container card">
        <div class="card-header">
            <h6 class="card-title">
                Users
            </h6>
        </div>

        <div class="card-body">
            <form th:action="@{/listUsers}" method=GET>
                <input placeholder="Filter" type="text" id="nameFilter" name="searchString">

                <button type="submit" class="btn btn-primary mb-2">Filter</button>
            </form>
            <table class="table table-bordered table-striped" id="film-table">
                <thead>
                <tr>
                    <th>Email</th>
                </tr>

                </thead>
                <tbody>
                <tr th:each="user: ${users}">
                    <td>
                        <a th:text="${user.email}" type="button" th:href="@{/showUser(userId=${user.id})}">
                        </a>
                    </td>
                    <td th:text="${user.firstName+ ' '+user.lastName}">

                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>
</div>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.11.5/datatables.min.js"></script>

</body>
</html>
