<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Sign Up - CodeJava</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/css/bootstrap.min.css"/>
    <script type="text/javascript" src="/webjars/jquery/jquery.min.js"></script>
    <script type="text/javascript" src="/webjars/bootstrap/js/bootstrap.min.js"></script>
</head>
<body>
<div class="container text-center">
    <div>
        <h1>You should get an email with a secret key, please enter it below to login</h1>
    </div>

    <form th:action="@{/twofa-confirmed}" method="post"
          style="max-width: 600px; margin: 0 auto;"
    >
        <div class="m-3">
            <div class="form-group row">
                <label class="" col-form-Label col-4> Secret Key</label>
                <div class="col-8">
                    <input type="text"
                           minlength="6"
                           maxlength="6"
                           class="form-control" name="secretKey" required/>
                </div>
            </div>

            <div>
                <button type="submit" class="btn btn-primary">Login</button>

            </div>
        </div>
    </form>
</div>
</body>
</html>
