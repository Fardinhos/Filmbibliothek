<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Sign Up - CodeJava</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/css/bootstrap.min.css"/>
    <script type="text/javascript" src="/webjars/jquery/jquery.min.js"></script>
    <script type="text/javascript" src="/webjars/bootstrap/js/bootstrap.min.js"></script>
</head>
<body>
<div class="container text-center">
    <div>
        <h1>Login</h1>
    </div>

    <form th:action="@{/twofa}" method="post"
          style="max-width: 600px; margin: 0 auto;"
    >
        <div class="m-3">
            <div class="form-group row">
                <label class="" col-form-Label col-4> E-Mail</label>
                <div class="col-8">
                    <input type="email" class="form-control" name="email" required/>
                </div>
            </div>
            <div class="form-group row">
                <label class="" col-form-Label col-4> Password</label>
                <div class="col-8">
                    <input type="password" class="form-control" name="password" required
                           minlength="6" maxlength="10"/>
                </div>
            </div>

            <div class="form-group row">
                <label class="" col-form-Label col-4> 2FA Token</label>
                <div class="col-8">
                    <input type="text" class="form-control" name="2faKey" required
                           minlength="6" maxlength="6"/>
                </div>
            </div>

            <div>
                <button type="submit" class="btn btn-primary">Login</button>

            </div>
        </div>
    </form>
</div>
</body>
</html>>
