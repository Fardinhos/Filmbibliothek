<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Single Group</title>
    <link rel="stylesheet"
          type="text/css"
          href="https://cdn.datatables.net/v/bs4/dt-1.11.5/datatables.min.css"/>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
    <!--CSS found here https://codepen.io/hesguru/pen/BaybqXv for 5 stars -->
    <link rel="stylesheet" th:href="@{/maincss.css}"/>
</head>

<body>


<div class="container">
    <div style="display: flex;flex-direction: row;justify-content: space-around">
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="Logout"/>
        </form>

        <form th:action="@{/}" method="get">
            <input type="submit" value="Back"/>
        </form>
    </div>
    <hr/>
    <div th:if="${!isMember}">
        <form th:action="@{/joinGroup(groupId=${group.id})}" method=POST>
            <button type="submit" class="btn btn-primary mb-2">Join Group</button>
        </form>
    </div>

    <div th:if="${isMember}">
        <form th:action="@{/leaveGroup(groupId=${group.id})}" method=POST>
            <button type="submit" class="btn btn-primary mb-2">Leave Group</button>
        </form>
    </div>

    <div class="container card">
        <div class="card-header">
            <h6 class="card-title">
                Admin
            </h6>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-striped" id="groups-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Admin</th>
                    <th>Private Group</th>
                </tr>

                </thead>
                <tbody>
                <tr th:object="${group}">
                    <td>
                        <a th:text="${group.name}" type="button">
                        </a>
                    </td>
                    <td th:text="${group.admin.firstName+ ' '+group.admin.lastName}">

                    </td>
                    <td th:text="${group.private?'Private':'Public'}"></td>

                </tr>

                </tbody>
            </table>
        </div>
    </div>


    <div class="container card">
        <div class="card-header">
            <h6 class="card-title">
                Users
            </h6>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-striped" id="users-table">
                <thead>
                <tr>
                    <th>Email</th>
                </tr>

                </thead>
                <tbody>
                <tr th:each="user: ${group.users}">
                    <td>
                        <a th:text="${user.email}" type="button" th:href="@{/showUser(userId=${user.id})}">
                        </a>
                    </td>
                    <td th:text="${user.firstName+ ' '+user.lastName}">

                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>


    <div class="container card" th:if="${isMember}">
        <div class="card-header">
            <h6 class="card-title">
                Chat
            </h6>
        </div>
        <div class="card-body">
            <div class="chat-history">
                <div class="chat-message" th:each="chatMessage : ${group.getMessages()}">
                    <div class="chat-message-author">
                        <span th:text="${chatMessage.getSentBy().firstName+' '+chatMessage.getSentBy().lastName}"></span>
                    </div>
                    <div class="chat-message-text">
                        <span th:text="${chatMessage.getContent()}"></span>
                    </div>
                    <div>
                        <span th:text="${chatMessage.getDateTime()}"></span>
                    </div>
                </div>
                <form th:action="@{/sendGroupMessage}" method="POST">


                    <input type="text"
                           th:value="${group.id}"
                           id="groupId"
                           name="groupId"
                           style="display: none;"/>
                    <div class="form-group">
                        <label for="content">Message</label>
                        <input type="text"
                               id="content"
                               name="message"
                               placeholder="Enter a message"
                               style="width: 100%;"/>
                    </div>
                    <button type="submit" class="btn btn-primary">Send</button>
                </form>

            </div>
        </div>
    </div>
</div>


<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.11.5/datatables.min.js"></script>

</body>
</html>
