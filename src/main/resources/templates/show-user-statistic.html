<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Statistic</title>
    <link rel="stylesheet"
          type="text/css"
          href="https://cdn.datatables.net/v/bs4/dt-1.11.5/datatables.min.css"/>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
    <!--CSS found here https://codepen.io/hesguru/pen/BaybqXv for 5 stars -->
    <link rel="stylesheet" th:href="@{/secondarycss.css}"/>
    <link rel="stylesheet" th:href="@{/maincss.css}"/>

</head>

<body>

<div style="display: flex; flex-direction: column">
    <div style="display: flex;flex-direction: row;justify-content: space-around">
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="Logout"/>
        </form>

        <form th:action="@{/}" method="get">
            <input type="submit" value="Back"/>
        </form>
    </div>
    <hr/>

    <div class="container card">
        <div class="card-header">
            <h6 class="card-title">
                User Statistic
            </h6>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-striped" id="statistics-table">
                <thead>
                <tr>
                    <th>Favorite Film</th>
                    <th>Favorite Actor</th>
                    <th>Favorite Category</th>
                    <th>Total Watch Time</th>

                </thead>
                <tbody>
                <tr th:object="${userStatistic}">
                    <td
                            th:if="${userStatistic.favoriteFilm != null}"
                            th:text="${userStatistic.getFavoriteFilm().name}">

                    </td>

                    <td
                            th:if="${userStatistic.favoriteActor != null}"
                            th:text="${userStatistic.getFavoriteActor()}">

                    </td>
                    <td
                            th:if="${userStatistic.favoriteFilm == null}"
                            th:text="'-'">

                    </td>

                    <td
                            th:if="${userStatistic.favoriteCategory != null}"
                            th:text="${userStatistic.getFavoriteCategory()}">

                    </td>
                    <td
                            th:if="${userStatistic.favoriteCategory == null}"
                            th:text="'-'">

                    </td>
                    <td
                            th:if="${userStatistic.watchTime != null}"
                            th:text="${userStatistic.getWatchTime()}">

                    </td>
                    <td
                            th:if="${userStatistic.watchTime == null}"
                            th:text="'-'">

                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.11.5/datatables.min.js"></script>
</body>
</html>
