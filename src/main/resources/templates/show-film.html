<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Show Film</title>
    <link rel="stylesheet"
          type="text/css"
          href="https://cdn.datatables.net/v/bs4/dt-1.11.5/datatables.min.css"/>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
    <!--CSS found here https://codepen.io/hesguru/pen/BaybqXv for 5 stars -->
    <link rel="stylesheet" th:href="@{/secondarycss.css}"/>
    <link rel="stylesheet" th:href="@{/maincss.css}"/>

</head>

<body>

<div style="display: flex; flex-direction: column">
    <div class="container">

        <div style="display: flex;flex-direction: row;justify-content: space-around">
            <form th:action="@{/logout}" method="post">
                <input type="submit" value="Logout"/>
            </form>

            <form th:action="@{/}" method="get">
                <input type="submit" value="Back"/>
            </form>
        </div>


        <hr/>

        <img
                th:if="${base64Image != null}"
                alt="Banner"
                th:src="${'data:image/png;base64,'+base64Image}"
                style="width: 50px;height: 50px">

        <form th:action="@{/rateFilm}" method=POST th:name="ratingForm">
            <table class="table table-bordered table-striped" id="film-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Length</th>
                    <th>Publish Date</th>
                    <th>Director</th>
                    <th>Script Author</th>
                    <th>Cast</th>
                    <th>Rating Text (Optional)</th>
                    <th>Rating</th>
                    <th></th>
                </tr>

                </thead>
                <tbody>
                <tr>
                    <td th:text="${film.name}"></td>
                    <td th:text="${film.category}"></td>
                    <td th:text="${film.length}"></td>
                    <td th:text="${film.pubDate}"></td>
                    <td th:text="${film.director}"></td>
                    <td th:text="${film.scriptAuthor}"></td>
                    <td th:text="${film.cast}"></td>
                    <td>
                        <input placeholder="Rating Text" type="text"
                               th:id="${filmRating?.getFilm()?.getId()}"
                               th:value="${filmRating?.getComment()}"
                               th:name="ratingText">
                        <!-- Hidden input to send with form -->
                        <input style="display: none" type="text" th:id="${filmRating?.getFilm()?.getId()}"
                               th:value="${film.getId()}"
                               th:name="filmId">
                    </td>
                    <td>
                        <div class="rate" style="display: flex; flex-direction: row-reverse">
                            <input type="radio" id="star5" name="rate" value="5"
                                   th:checked="${filmRating?.getRating() == 5}"/>
                            <label for="star5" title="text">5 stars</label>
                            <input type="radio" id="star4" name="rate" value="4"
                                   th:checked="${filmRating?.getRating() == 4}"/>
                            <label for="star4" title="text">4 stars</label>
                            <input type="radio" id="star3" name="rate" value="3"
                                   th:checked="${filmRating?.getRating() == 3}"/>
                            <label for="star3" title="text">3 stars</label>
                            <input type="radio" id="star2" name="rate" value="2"
                                   th:checked="${filmRating?.getRating() == 2}"/>
                            <label for="star2" title="text">2 stars</label>
                            <input type="radio" id="star1" name="rate" value="1"
                                   th:checked="${filmRating?.getRating() == 1}"/>
                            <label for="star1" title="text">1 star</label>
                        </div>

                    </td>
                    <td>
                        <button type="submit" class="btn  ml-2">Rate</button>
                    </td>
                </tr>

                </tbody>
            </table>
        </form>
    </div>
    <div class="container card">
        <div class="card-header">
            <h6 class="card-title">
                Users Ratings
            </h6>
        </div>

        <div class="card-body">
            <table class="table table-bordered table-striped" id="watched-films-table">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>User</th>
                    <th>Rating Text (Optional)</th>
                    <th>Rating</th>

                </thead>
                <tbody>
                <tr th:each="filmRating: ${filmRatings}">
                    <form th:action="@{/rateFilm}" method=POST>
                        <td>
                            <a th:text="${filmRating.getFilm().name}"
                               type="button"
                               th:href="@{/showFilm(filmId=${
                            filmRating.getFilm().getId()})}">
                            </a>
                        </td>
                        <td>
                            <a th:text="${filmRating.getUser().getEmail()}"
                               th:href="@{/showUser(userId=${filmRating.getUser().getId()})}">

                            </a>
                        </td>

                        <td>
                            <input placeholder="Rating Text" type="text"
                                   th:id="${filmRating.getFilm().getId()}"
                                   th:value="${filmRating.getComment()}"
                                   disabled
                                   th:name="ratingText">
                            <!-- Hidden input to send with form -->
                            <input style="display: none" type="text" th:id="${filmRating.getFilm().getId()}"
                                   th:value="${filmRating.getFilm().getId()}"
                                   th:name="filmId">
                        </td>
                        <td>
                            <div class="rate_static">
                                <input type="radio" th:id="${filmRating.getId()+'star5'}" name="rate" value="5"
                                       disabled
                                       th:checked="${filmRating.getRating() == 5}"/>
                                <label th:for="${filmRating.getId()+'star5'}" title="text">5 stars</label>
                                <input type="radio" th:id="${filmRating.getId()+'star4'}" name="rate" value="4"
                                       disabled
                                       th:checked="${filmRating.getRating() == 4}"/>
                                <label th:for="${filmRating.getId()+'star4'}" title="text">4 stars</label>
                                <input type="radio" th:id="${filmRating.getId()+'star3'}" name="rate" value="3"
                                       disabled
                                       th:checked="${filmRating.getRating() == 3}"/>
                                <label th:for="${filmRating.getId()+'star3'}" title="text">3 stars</label>
                                <input type="radio" th:id="${filmRating.getId()+'star2'}" name="rate" value="2"
                                       disabled
                                       th:checked="${filmRating.getRating() == 2}"/>
                                <label th:for="${filmRating.getId()+'star2'}" title="text">2 stars</label>
                                <input type="radio" th:id="${filmRating.getId()+'star1'}" name="rate" value="1"
                                       disabled
                                       th:checked="${filmRating.getRating() == 1}"/>
                                <label th:for="${filmRating.getId()+'star1'}" title="text">1 star</label>
                            </div>
                        </td>
                    </form>
                </tr>

                </tbody>
            </table>

        </div>
    </div>
    <div th:if="${user.getAdmin()}"
         class="container card">
        <div class="card-header">
            <h6 class="card-title">
                Statistics
            </h6>
        </div>

        <div class="card-body">
            <table class="table table-bordered table-striped" id="statistics-table">
                <thead>
                <tr>
                    <th>Average Rating</th>
                    <th>Number of Ratings</th>
                    <th>Watch Count</th>
                    <th></th>
                    <th></th>


                </thead>
                <tbody>
                <tr th:object="${filmStatistic}">
                    <form th:action="@{/resetStatistic(filmId=${film.id})}" method=POST>
                        <td th:text="${filmStatistic.getAverageRating()}">

                        </td>
                        <td th:text="${filmStatistic.getNumberOfRatings()}">

                        </td>

                        <td th:text="${filmStatistic.getNumberOfViews()}">

                        </td>
                        <td>
                            <button type="submit" class="btn btn-primary">Reset</button>
                        </td>
                        <td>
                            <a th:href="@{/downloadStatistic(filmStatisticId=${filmStatistic.id})}">Download</a>
                        </td>

                    </form>
                </tr>

                </tbody>
            </table>
        </div>

    </div>


</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.11.5/datatables.min.js"></script>
</body>
</html>
